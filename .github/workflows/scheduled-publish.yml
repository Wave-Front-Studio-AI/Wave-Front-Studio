name: Scheduled publish

# Each weekday morning: publish any blog draft in blog-agent/drafts/ whose date
# has arrived (publish-post.mjs holds the rest), check and build the site, then
# commit to main. The push deploys through Vercel. If nothing was due, it
# triggers a rebuild instead so scheduled pages in src/data/schedule.js go live.
#
# A draft that fails validation, lint or the build stops the job before anything
# is pushed. Needs the repository secret VERCEL_DEPLOY_HOOK: a deploy hook URL
# created in Vercel under Project > Settings > Git > Deploy Hooks, pointed at
# the main branch.

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Publish drafts that are due
        id: publish
        run: |
          node blog-agent/publish-post.mjs --all
          if git diff --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and build before pushing
        if: steps.publish.outputs.published == 'true'
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit and push to main
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/posts.js src/routes.js
          git commit -m "Publish scheduled blog posts"
          git push origin HEAD:main

      - name: Trigger a production deploy
        if: steps.publish.outputs.published != 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set, so nothing was rebuilt."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
